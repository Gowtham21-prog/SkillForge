spring.application.name=elearning-platform

# ----- MySQL Datasource -----
# All secrets are read from environment variables, with local-dev defaults as fallback.
# NEVER commit real production credentials here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/elearning_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ----- Server -----
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# ----- JWT -----
# app.jwt.secret MUST be overridden via JWT_SECRET env var in any non-local environment.
# Generate one with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJWTTokenGenerationPleaseChangeInProduction123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ----- File Upload -----
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.allowed-image-types=image/jpeg,image/png,image/webp,image/gif
app.upload.allowed-video-types=video/mp4,video/webm,video/quicktime
app.upload.max-image-size-bytes=5242880
app.upload.max-video-size-bytes=20971520

# ----- CORS -----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ----- Mail (for verification / password reset) -----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@learnhub.local}
app.mail.enabled=${MAIL_ENABLED:false}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# ----- Stripe -----
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.enabled=${STRIPE_ENABLED:false}

# ----- Rate limiting -----
app.ratelimit.login-attempts=${RATE_LIMIT_LOGIN:7}
app.ratelimit.login-window-minutes=${RATE_LIMIT_LOGIN_WINDOW:1}
app.ratelimit.register-attempts=${RATE_LIMIT_REGISTER:3}
app.ratelimit.register-window-minutes=${RATE_LIMIT_REGISTER_WINDOW:60}

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.com.elearning=${LOG_LEVEL_APP:INFO}
